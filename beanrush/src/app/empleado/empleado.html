<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="logo">☕</div>
      <h2>Cafetín</h2>
    </div>
    <div class="user-info">
      <span class="welcome">¡Hola, {{user?.name}}!</span>
      <button (click)="logout()" class="logout-btn">
        Salir
      </button>
    </div>
  </div>

  <!-- Órdenes Pendientes -->
  <div class="cart-section">
    <h3>🆕 Nuevas Órdenes</h3>
    <div *ngFor="let order of getPendingOrders()" class="cart-item">
      <div class="container-order">
        <h4>#{{order.number}} - {{order.table}}</h4>
        <p>{{order.items}}</p>
        <p><strong>${{order.total}}</strong></p>
      </div>
      <button (click)="changeOrderStatus(order, 'preparing')" class="action-btn">
        Preparar
      </button>
    </div>
  </div>

  <!-- Órdenes en Preparación -->
  <div class="cart-section">
    <h3>🧑‍🍳 En Preparación</h3>
    <div *ngFor="let order of getPreparingOrders()" class="cart-item">
      <h4>#{{order.number}} - {{order.table}}</h4>
      <p>{{order.items}}</p>
      <button (click)="changeOrderStatus(order, 'completed')" class="action-btn ready">
        ✅ Listo
      </button>
    </div>
  </div>
</div>
