<div class="login-container">
  <div class="login-card">
    <h2>BeanRush</h2>
    <h3>Iniciar Sesión</h3>
    
    <!-- Mensaje de error -->
    <div *ngIf="error" class="error-message" role="alert">
      {{ error }}
    </div>
    
    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <input 
          id="email"
          type="email" 
          placeholder="Correo electrónico"
          [(ngModel)]="credentials.email"
          name="email"
          class="form-input"
          [class.error]="error"
          required>
      </div>
      
      <div class="form-group">
        <input 
          id="password"
          type="password" 
          placeholder="Contraseña"
          [(ngModel)]="credentials.password"
          name="password"
          class="form-input"
          [class.error]="error"
          required>
      </div>
      
      <button 
        type="submit" 
        class="login-btn"
        [disabled]="isLoading">
        {{ isLoading ? 'INICIANDO SESIÓN...' : 'INGRESAR' }}
      </button>
    </form>

    <button (click)="newAccount()" class="signup-btn">
      Crear nueva cuenta
    </button>
  </div>
</div>
